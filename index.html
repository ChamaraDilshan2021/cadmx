            padding: 20px;

            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: all 0.3s ease;
        }

            overflow-y: auto;

            box-sizing: border-box;

            transition: background-color 0.2s;
            z-index: 10;
        }
        .resizer:hover, .resizer:active {
            background-color: var(--primary);
        }

        .right-panel {
            flex: 1 1 0%; /* DEFAULT RATIO: Takes remaining 65% */

            flex-direction: column;

            border-radius: 4px;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #e9ecef;

            font-size: 1rem;
            font-family: 'Inter', sans-serif;

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }

        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }

        input:checked + .slider:before { transform: translateX(20px); }

    };

    // --- State Variables ---
    let studentName = "";
    let currentChapterNum = 0;
    let currentQuestionIndex = 0;
    let correctAnswersCount = 0;
    let isAiEnabled = false; // DEFAULT AI OFF
    let isSourceEnabled = true;

    // --- PDF.js State Variables ---
    let pdfDoc = null;
    let currentPdfPage = 1;
    let isPdfRendering = false;
    let pdfRenderQueue = null;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    // ==========================================
    // --- Draggable Split View Logic ---
    // ==========================================
    const resizer = document.getElementById('drag-divider');
    const leftPanel = document.getElementById('quiz-panel');
    let x = 0;
    let leftWidth = 0;

    const mouseDownHandler = function(e) {
        if (!isSourceEnabled) return; // Disable dragging if full screen
        x = e.clientX;
        leftWidth = leftPanel.getBoundingClientRect().width;
        document.addEventListener('mousemove', mouseMoveHandler);
        document.addEventListener('mouseup', mouseUpHandler);
        document.body.style.cursor = 'col-resize';
    };

    const mouseMoveHandler = function(e) {
        if (!isSourceEnabled) return;
        const dx = e.clientX - x;
        const newLeftWidth = ((leftWidth + dx) * 100) / resizer.parentNode.getBoundingClientRect().width;
        if(newLeftWidth > 15 && newLeftWidth < 85) {
            leftPanel.style.flex = `0 0 ${newLeftWidth}%`;
        }
    };

    const mouseUpHandler = function() {
        document.removeEventListener('mousemove', mouseMoveHandler);
        document.removeEventListener('mouseup', mouseUpHandler);
        document.body.style.cursor = '';
        if (pdfDoc && isSourceEnabled) queueRenderPage(currentPdfPage);
    };

    resizer.addEventListener('mousedown', mouseDownHandler);

    // ==========================================
    // --- Fullscreen & Sync Logic ---
    // ==========================================
    function toggleFullscreen() {
        const pdfPanel = document.getElementById('pdf-panel');
        if (!document.fullscreenElement) {
            pdfPanel.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.addEventListener('fullscreenchange', () => {
        if (pdfDoc && isSourceEnabled) queueRenderPage(currentPdfPage);
    });

    function jumpToRefPage() {
        if (!pdfDoc || !isSourceEnabled) return;
        const currentQ = chapterData[currentChapterNum]?.questions[currentQuestionIndex];
        if (currentQ && currentQ.page) {
            queueRenderPage(currentQ.page);
        }
    }

    function updateSyncButton(renderedPageNum) {
        const btn = document.getElementById('ref-page-btn');
        const currentQ = chapterData[currentChapterNum]?.questions[currentQuestionIndex];
        
        if (!btn || !currentQ || !currentQ.page || !isSourceEnabled) {
            if(btn) btn.classList.add('hidden');
            return;
        }

        btn.classList.remove('hidden');
        
        if (renderedPageNum === currentQ.page) {
            btn.disabled = true;
            btn.innerText = "✓ Synced";
            btn.style.background = "transparent";
            btn.style.borderColor = "#6c757d";
            btn.style.color = "#6c757d";
        } else {
            btn.disabled = false;
            btn.innerText = "↶ Back to Q Page";
            btn.style.background = "var(--primary)";
            btn.style.borderColor = "var(--primary)";
            btn.style.color = "white";
        }
    }

    // ==========================================
    // --- Initialization & UI Flow ---
    // ==========================================
    function shuffleOptions(options) {
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        return options;
    }

    function switchSection(sectionId) {
        document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(sectionId).classList.remove('hidden');
    }

    function toggleAI() {
        isAiEnabled = document.getElementById('ai-toggle').checked;
    }

    function toggleSource() {
        isSourceEnabled = document.getElementById('source-toggle').checked;
    }

    function startApp() {
        const nameInput = document.getElementById('student-name').value.trim();
        if (!nameInput) return alert("Please enter your name to proceed.");
        studentName = nameInput;
        document.getElementById('display-name').innerText = studentName;
        renderChapters();
        switchSection('chapters-section');
    }

    function renderChapters() {
        const list = document.getElementById('chapter-list');
        list.innerHTML = ''; 
        
        Object.keys(chapterData).forEach(key => {
            const chapter = chapterData[key];
            const btn = document.createElement('button');
            btn.className = 'chapter-btn';
            btn.innerHTML = `<strong style="color: var(--primary);">${chapter.title}</strong><br> <span style="font-size: 0.9rem; color: var(--text-muted);">${chapter.questions.length} Interactive Questions</span>`;
            btn.onclick = () => startQuiz(key);
            list.appendChild(btn);
        });
    }

    // ==========================================
    // --- PDF.js Core Functions ---
    // ==========================================
    async function loadPDFDocument(url) {
        if (!isSourceEnabled) return; // Do not load if disabled
        try {
            const loadingTask = pdfjsLib.getDocument(url);
            pdfDoc = await loadingTask.promise;
            document.getElementById('page-count').innerText = pdfDoc.numPages;
        } catch (error) {
            console.error('Error loading PDF: ', error);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "16px Inter";
            ctx.fillText("Failed to load PDF. Check URL/CORS.", 20, 50);
        }
    }

    async function renderPdfPage(num) {
        if (!pdfDoc || !isSourceEnabled) return;
        isPdfRendering = true;
        
        try {
            const page = await pdfDoc.getPage(num);
            const container = document.querySelector('.pdf-container');
            if (!container) throw new Error("PDF container not found.");

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const unscaledViewport = page.getViewport({ scale: 1 });

            // Fit page exactly into the container with a 5% margin
            const scaleWidth = containerWidth / unscaledViewport.width;
            const scaleHeight = containerHeight / unscaledViewport.height;
            const scale = Math.min(scaleWidth, scaleHeight) * 0.95; 
            
            const viewport = page.getViewport({ scale: scale });
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = { canvasContext: ctx, viewport: viewport };
            await page.render(renderContext).promise;

            isPdfRendering = false;
            document.getElementById('page-num').innerText = num;
            currentPdfPage = num;
            
            updateSyncButton(num);

            if (pdfRenderQueue !== null) {
                renderPdfPage(pdfRenderQueue);
                pdfRenderQueue = null;
            }
        } catch (error) {
            console.error('Error rendering PDF page: ', error);
            isPdfRendering = false;
        }
    }

    function queueRenderPage(num) {
        if (isPdfRendering) {
            pdfRenderQueue = num;
        } else {
            renderPdfPage(num);
        }
    }

    function changePage(offset) {
        if (!pdfDoc || !isSourceEnabled) return;
        let newPage = currentPdfPage + offset;
        if (newPage >= 1 && newPage <= pdfDoc.numPages) {
            queueRenderPage(newPage);
        }
    }

    // ==========================================
    // --- Quiz Engine ---
    // ==========================================
    function startQuiz(chapterNum) {
        currentChapterNum = chapterNum;
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        
        const chapter = chapterData[chapterNum];
        document.getElementById('quiz-title').innerText = `${chapter.title}`;
        document.getElementById('total-q-num').innerText = chapter.questions.length;
        
        switchSection('quiz-section');
        
        const rightPanel = document.getElementById('pdf-panel');
        
        // Handle Layout based on Source Toggle
        if (isSourceEnabled) {
            leftPanel.style.flex = "0 0 35%"; // SET TO 35% DEFAULT
            resizer.style.display = "block";
            rightPanel.style.display = "flex";
            
            loadPDFDocument(chapter.pdfUrl).then(() => {
                loadQuestion();
            });
        } else {
            leftPanel.style.flex = "0 0 100%";
            resizer.style.display = "none";
            rightPanel.style.display = "none";
            
            // Just load questions immediately
            loadQuestion();
        }
    }

    function loadQuestion() {
        document.getElementById('ai-response').classList.add('hidden');
        document.getElementById('ai-hint-btn').classList.toggle('hidden', !isAiEnabled);
        document.getElementById('next-btn').classList.add('hidden');
        
        const chapter = chapterData[currentChapterNum];
        const currentQ = chapter.questions[currentQuestionIndex];

        document.getElementById('current-q-num').innerText = currentQuestionIndex + 1;
        const progress = (currentQuestionIndex / chapter.questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        document.getElementById('question-text').innerText = currentQ.question;
        
        // Handle PDF syncing only if source is enabled
        if (isSourceEnabled && currentQ.page) {
            queueRenderPage(currentQ.page);
            updateSyncButton(currentQ.page); 
        } else {
            document.getElementById('ref-page-btn').classList.add('hidden');
        }
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const shuffledOptions = shuffleOptions([...currentQ.options]);
        shuffledOptions.forEach(option => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = (e) => handleAnswer(option, currentQ.answer, e.target);
            optionsContainer.appendChild(btn);
        });
    }

    function handleAnswer(selectedOption, correctOption, clickedBtn) {
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.classList.add('disabled-btn'));

        if (selectedOption === correctOption) {
            correctAnswersCount++;
            clickedBtn.classList.add('btn-correct');
            setTimeout(() => { proceedToNext(); }, 1200); 
        } else {
            clickedBtn.classList.add('btn-wrong');
            allButtons.forEach(btn => {
                if (btn.innerText === correctOption) {
                    btn.classList.add('btn-correct');
                }
            });

            if (isAiEnabled) {
                getAIExplanation(true);
                document.getElementById('ai-hint-btn').classList.add('hidden');
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }
    }

    function proceedToNext() {
        currentQuestionIndex++;
        if (currentQuestionIndex < chapterData[currentChapterNum].questions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        document.getElementById('progress-bar').style.width = '100%';
        const total = chapterData[currentChapterNum].questions.length;
        const percentage = Math.round((correctAnswersCount / total) * 100);
        
        document.getElementById('raw-score').innerText = `${correctAnswersCount} / ${total}`;
        document.getElementById('final-score').innerText = `${percentage}%`;
        
        silentGoogleSheetSubmit(percentage);
        setTimeout(() => { switchSection('results-section'); }, 500); 
    }

    async function silentGoogleSheetSubmit(percentage) {
        if(GOOGLE_SHEET_WEBAPP_URL === "YOUR_WEB_APP_URL_HERE") return;
        try {
            const cName = chapterData[currentChapterNum].title;
            const chapterFormatted = `Module ${currentChapterNum}: ${cName}`;

            const formData = new URLSearchParams();
            formData.append('name', studentName);
            formData.append('chapter', chapterFormatted);
            formData.append('score', `${percentage}%`);

            fetch(GOOGLE_SHEET_WEBAPP_URL, { method: 'POST', body: formData });
        } catch (error) { console.error("Error triggering submit:", error); }
    }

    function backToChapters() {
        switchSection('chapters-section');
    }

    // ==========================================
    // --- AI Integration ---
    // ==========================================
    async function getAIExplanation(isAutoTrigger = false) {
        const activeKey = API_KEYS[ACTIVE_AI_PROVIDER];
        const aiBox = document.getElementById('ai-response');
        const currentQ = chapterData[currentChapterNum].questions[currentQuestionIndex];

        if (!activeKey || activeKey.includes("YOUR_")) {
            aiBox.classList.remove('hidden');
            aiBox.innerHTML = `<strong>Configuration Error:</strong> Valid API key not found.`;
            return;
        }
        
        aiBox.classList.remove('hidden');
        aiBox.innerHTML = `<em>${isAutoTrigger ? "Generating explanation..." : "Connecting to Tutor..."}</em>`;
        
        const promptText = `You are a Computer Architecture tutor. A student is answering: "${currentQ.question}". The correct answer is: "${currentQ.answer}". Provide a brief, 1-3 sentence explanation of why this is correct based on the lecture material. No markdown.`;

        try {
            let aiText = "";
            if (ACTIVE_AI_PROVIDER === 'gemini') {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${activeKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }], generationConfig: { temperature: 0.3 } })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                aiText = data.candidates[0].content.parts[0].text;
            } else if (ACTIVE_AI_PROVIDER === 'groq') {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${activeKey}` },
                    body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ "role": "user", "content": promptText }], temperature: 0.3 })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                aiText = data.choices[0].message.content;
            }
            aiBox.innerHTML = `${aiText}`;
        } catch (error) {
            aiBox.innerHTML = `⚠️ <strong>System Error:</strong> ${error.message}`;
        }
    }

    // Enter key navigation
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            const nextBtn = document.getElementById('next-btn');
            if (nextBtn && !nextBtn.classList.contains('hidden')) {
                event.preventDefault(); proceedToNext();
            }
            const setupSection = document.getElementById('setup-section');
            if (setupSection && !setupSection.classList.contains('hidden') && document.activeElement.id === 'student-name') {
                event.preventDefault(); startApp();
            }
        }
    });

    // Handle window resize for PDF scaling
    window.addEventListener('resize', () => {
        if (isSourceEnabled && !document.getElementById('quiz-section').classList.contains('hidden') && pdfDoc) {
            queueRenderPage(currentPdfPage);
        }
    });
